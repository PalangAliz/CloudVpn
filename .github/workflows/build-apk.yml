name: Build Debug APK & Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java environment
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
          JAVA_VER_OUTPUT="$(java -version 2>&1)"
          echo "$JAVA_VER_OUTPUT"
          VERSION_RAW="$(echo "$JAVA_VER_OUTPUT" | awk -F '"' '/version/ {print $2; exit}')"
          if [ -z "$VERSION_RAW" ]; then
            echo "::error::Unable to detect active Java version."
            exit 1
          fi
          MAJOR_VER="$(echo "$VERSION_RAW" | awk -F '.' '{if ($1 == "1") print $2; else print $1}' | tr -cd '0-9')"
          if [ -z "$MAJOR_VER" ]; then
            echo "::error::Unable to parse active Java major version from '$VERSION_RAW'."
            exit 1
          fi
          echo "Detected Java major version: $MAJOR_VER"
          if [ "$MAJOR_VER" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected Java $MAJOR_VER."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        run: |
          set -euo pipefail
          KEYSTORE_PATH="./debug.keystore"
          if [ -f "$KEYSTORE_PATH" ]; then
            echo "Debug keystore already exists."
          else
            KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
            if [ ! -x "$KEYTOOL_BIN" ]; then
              KEYTOOL_BIN="$(command -v keytool || true)"
            fi
            if [ -z "$KEYTOOL_BIN" ] || [ ! -x "$KEYTOOL_BIN" ]; then
              echo "::error::keytool executable not found in Java 17 installation."
              exit 1
            fi
            "$KEYTOOL_BIN" -genkeypair -noprompt \
              -keystore "$KEYSTORE_PATH" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "$KEYSTORE_PATH" ] || [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Failed to create temporary debug keystore at $KEYSTORE_PATH."
            exit 1
          fi
          echo "Temporary debug keystore ready."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "$APK_PATH" ]; then
            echo "::error::Expected debug APK not found at $APK_PATH"
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name "*.apk" || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::$APK_PATH is not a regular file."
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "::error::$APK_PATH is empty."
            exit 1
          fi
          case "$APK_PATH" in
            *.apk) ;;
            *)
              echo "::error::$APK_PATH does not have the .apk extension."
              exit 1
              ;;
          esac
          APK_SIZE="$(wc -c < "$APK_PATH")"
          echo "Verified debug APK: $APK_PATH (${APK_SIZE} bytes)"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$SOURCE_APK" ] || [ ! -s "$SOURCE_APK" ]; then
            echo "::error::Verified APK missing at $SOURCE_APK"
            exit 1
          fi
          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO_NAME="$(echo "$RAW_REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/-+/-/g; s/^-+//; s/-+$//')"
          if [ -z "$SAFE_REPO_NAME" ]; then
            SAFE_REPO_NAME="android-app"
          fi
          ASSET_DIR="${RUNNER_TEMP}/release-asset"
          mkdir -p "$ASSET_DIR"
          ASSET_NAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_PATH="${ASSET_DIR}/${ASSET_NAME}"
          cp "$SOURCE_APK" "$ASSET_PATH"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Failed to prepare release asset at $ASSET_PATH"
            exit 1
          fi
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $ASSET_NAME"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
        run: |
          set -euo pipefail
          gh --version
          if [ -z "${ASSET_PATH:-}" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Prepared release asset does not exist or is empty."
            exit 1
          fi
          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "::error::Prepared release asset does not have a .apk extension."
              exit 1
              ;;
          esac

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          RELEASE_NOTES=$(cat <<EOF
          This is an automatically generated debug APK.

          - Built by: GitHub Actions
          - Run number: ${GITHUB_RUN_NUMBER}
          - Run attempt: ${GITHUB_RUN_ATTEMPT}
          - Source commit SHA: ${GITHUB_SHA}
          - Purpose: Testing only (not a Play Store production release)
          - Signing: Signed only with a temporary debug keystore
          EOF
          )

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_title=$RELEASE_TITLE" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: ${{ !cancelled() && steps.prepare_asset.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.publish_release.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.publish_release.outputs.release_title }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
        run: |
          set -euo pipefail
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            RELEASE_URL="$(gh release view "$RELEASE_TAG" --json url --jq '.url')"
            VERIFIED_ASSET="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[0].name')"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "Release APK Asset: ${VERIFIED_ASSET:-$ASSET_NAME}"

            {
              echo "### Debug APK Build & Release Published"
              echo ""
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **Release URL:** ${RELEASE_URL}"
              echo "- **APK Asset:** \`${VERIFIED_ASSET:-$ASSET_NAME}\`"
              echo "- You can download the APK directly from the **Assets** section on the GitHub Release page."
              echo "- The normal GitHub Actions artifact (\`app-debug-apk\`) is also available as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed, but the debug APK build and Actions artifact upload succeeded."
            echo "Backup artifact available: app-debug-apk"

            {
              echo "### Debug APK Build Succeeded (Release Publishing Failed)"
              echo ""
              echo "> **Warning:** Publishing to GitHub Releases failed, so no release URL was created."
              echo ""
              echo "- **APK Build:** Succeeded (\`app/build/outputs/apk/debug/app-debug.apk\`)"
              echo "- **Backup Download:** Download the Actions artifact named \`app-debug-apk\` from this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
